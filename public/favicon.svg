<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="omnimGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1C9" />
      <stop offset="25%" stop-color="#E5B887" />
      <stop offset="65%" stop-color="#B87B4C" />
      <stop offset="100%" stop-color="#F2D0B0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090A0D" />
  
  <!-- Outer glowing path -->
  <path 
    d="M 256 256 C 330 175, 375 145, 375 100 C 375 52, 322 40, 256 40 C 190 40, 137 52, 137 100 C 137 145, 182 175, 256 256 C 330 337, 375 367, 375 412 C 375 460, 322 472, 256 472 C 190 472, 137 460, 137 412 C 137 367, 182 337, 256 256 Z"
    fill="none" 
    stroke="url(#omnimGold)" 
    stroke-width="52" 
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- Core high-specular line -->
  <path 
    d="M 256 256 C 330 175, 375 145, 375 100 C 375 52, 322 40, 256 40 C 190 40, 137 52, 137 100 C 137 145, 182 175, 256 256 C 330 337, 375 367, 375 412 C 375 460, 322 472, 256 472 C 190 472, 137 460, 137 412 C 137 367, 182 337, 256 256 Z"
    fill="none" 
    stroke="#FFF4E6" 
    stroke-width="12" 
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.85"
  />

  <!-- Subtle specular sparkles -->
  <circle cx="210" cy="55" r="5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="302" cy="457" r="5" fill="#FFFFFF" opacity="0.9" />
</svg>